<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lightning Tab Groups Settings</title>

    <link rel="stylesheet" type="text/css" media="all" href="options.css"/>

    <script src="../global.js"></script>
    <script src="options.js" type="module"></script>
</head>
<body>
<div id="settings-container">

    <header class="top">
        <div class="brand">
            <img class="logo" src="/ui/icons/logo.svg" alt="">
            <div>
                <h1>Lightning Tab Groups</h1>
                <p class="tagline"><span class="dot"></span>Changes are saved automatically</p>
            </div>
        </div>
        <nav class="links" aria-label="Links">
            <a class="tbtn" href="https://gchristensen.github.io/lightning-tab-groups/" target="_blank">Homepage</a>
            <a class="tbtn" href="/ui/help/manual.html" target="_blank"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7"/><path d="M12 17.5v.01"/></svg>User manual</a>
        </nav>
    </header>

    <section class="card" aria-labelledby="appearance-heading">
        <h2 id="appearance-heading">Appearance</h2>

        <div class="row">
            <div class="row-text">
                <div class="row-title">Color theme</div>
                <p class="hint">Used by the popup and the sidebar.</p>
            </div>
            <div class="seg" role="radiogroup" aria-label="Color theme">
                <label><input type="radio" name="color-theme" value="auto"/><span><svg class="check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>Auto</span></label>
                <label><input type="radio" name="color-theme" value="light"/><span><svg class="check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>Light</span></label>
                <label><input type="radio" name="color-theme" value="dark"/><span><svg class="check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>Dark</span></label>
            </div>
        </div>

        <div class="divider"></div>

        <div class="group">
            <div class="row nowrap">
                <label class="row-text" for="option-highlight-selection">
                    <span class="row-title">Highlight the selected tab group</span>
                    <span class="hint">Colors the active group's row in the tab group list.</span>
                </label>
                <input id="option-highlight-selection" class="switch" type="checkbox" role="switch"/>
            </div>
            <div id="highlight-colors" class="swatches" role="radiogroup" aria-labelledby="highlight-colors-label">
                <span id="highlight-colors-label" class="label">Highlight color</span>
                <label class="swatch" title="Blue"><input type="radio" name="highlight-color" value="rgba(11, 87, 208, 0.24)" data-hex="#0b57d0" aria-label="Blue"/><span style="--c: #0b57d0"></span></label>
                <label class="swatch" title="Teal"><input type="radio" name="highlight-color" value="rgba(0, 123, 131, 0.24)" data-hex="#007b83" aria-label="Teal"/><span style="--c: #007b83"></span></label>
                <label class="swatch" title="Green"><input type="radio" name="highlight-color" value="rgba(24, 128, 56, 0.24)" data-hex="#188038" aria-label="Green"/><span style="--c: #188038"></span></label>
                <label class="swatch" title="Orange"><input type="radio" name="highlight-color" value="rgba(232, 113, 10, 0.26)" data-hex="#e8710a" aria-label="Orange"/><span style="--c: #e8710a"></span></label>
                <label class="swatch" title="Red"><input type="radio" name="highlight-color" value="rgba(217, 48, 37, 0.22)" data-hex="#d93025" aria-label="Red"/><span style="--c: #d93025"></span></label>
                <label class="swatch" title="Purple"><input type="radio" name="highlight-color" value="rgba(147, 52, 230, 0.24)" data-hex="#9334e6" aria-label="Purple"/><span style="--c: #9334e6"></span></label>
                <label id="custom-color" class="custom-color">
                    <input id="option-selection-highlight-color" type="color" aria-label="Custom highlight color"/>
                    <span id="custom-color-label">Custom</span>
                </label>
            </div>
        </div>

        <div class="divider"></div>

        <div class="group">
            <div class="row nowrap">
                <label class="row-text" for="option-use-solid-mnemonic">
                    <span class="row-title">Use solid mnemonic</span>
                    <span class="hint">Fill the toolbar badge with the group color instead of outlining it.</span>
                </label>
                <input id="option-use-solid-mnemonic" class="switch" type="checkbox" role="switch"/>
            </div>
            <div class="toolbar-preview">
                <div class="toolbar" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
                    <div class="address">example.com/notes</div>
                    <span id="mnemonic-preview" class="mnemonic">W</span>
                </div>
                <span class="hint">Toolbar preview · current group: <strong>Work</strong></span>
            </div>
        </div>
    </section>

    <section class="card" aria-labelledby="list-heading">
        <h2 id="list-heading">Tab group list</h2>
        <div class="list-layout">
            <div class="list-options">
                <div class="row nowrap">
                    <label class="row-text" for="option-capitalize-default-tab-group">
                        <span class="row-title">Capitalize the default group</span>
                        <span class="hint">Show “Default” instead of “default”.</span>
                    </label>
                    <input id="option-capitalize-default-tab-group" class="switch" type="checkbox" role="switch"/>
                </div>
                <div class="row nowrap">
                    <label class="row-text" for="option-sort-tab-groups-alphabetically">
                        <span class="row-title">Sort alphabetically</span>
                        <span class="hint">The default group always stays on top.</span>
                    </label>
                    <input id="option-sort-tab-groups-alphabetically" class="switch" type="checkbox" role="switch"/>
                </div>
                <div class="row nowrap">
                    <label class="row-text" for="option-show-mouse-controls">
                        <span class="row-title">Show mouse controls</span>
                        <span class="hint">Edit, delete and new-group buttons. Keyboard shortcuts work either way.</span>
                    </label>
                    <input id="option-show-mouse-controls" class="switch" type="checkbox" role="switch"/>
                </div>
            </div>

            <div class="popup-preview">
                <span class="label">Popup preview</span>
                <div class="popup" aria-hidden="true">
                    <div class="popup-title">
                        <span class="grow">Tab groups</span>
                        <svg class="popup-mouse-control" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                        <svg class="popup-mouse-control" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7"/><path d="M12 17.5v.01"/></svg>
                    </div>
                    <div id="popup-groups" class="popup-groups"></div>
                </div>
            </div>
        </div>
    </section>

    <footer class="foot">
        <span id="addon-version"></span>
        <span class="foot-links">
            <a href="/ui/help/manual.html" target="_blank">User manual</a>
            <a href="https://gchristensen.github.io/lightning-tab-groups/" target="_blank">Homepage</a>
            <a href="https://gchristensen.github.io/" target="_blank">More add-ons</a>
        </span>
    </footer>
</div>
</body>
</html>
